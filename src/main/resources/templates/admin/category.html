<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{base::layout(~{::section})}">
<head>
<meta charset="UTF-8">
<title>Categories - Admin Dashboard</title>
</head>
<body>
	<section class="py-5">
		<div class="container-fluid px-lg-5">
			<div class="d-flex justify-content-between align-items-center mb-4">
				<div>
					<a href="/admin/" class="text-decoration-none text-muted small fw-semibold me-2">
						<i class="fa-solid fa-arrow-left me-1"></i> Dashboard
					</a>
					<h3 class="fw-bold mb-0">Category Management</h3>
				</div>
			</div>

			<div th:if="${session.succMsg}" class="alert alert-success alert-dismissible fade show rounded-3 mb-4" role="alert">
				<i class="fa-solid fa-circle-check me-2"></i> [[${session.succMsg}]]
				<th:block th:text="${@commnServiceImpl.removeSessionMessage()}"></th:block>
			</div>

			<div th:if="${session.errorMsg}" class="alert alert-danger alert-dismissible fade show rounded-3 mb-4" role="alert">
				<i class="fa-solid fa-circle-xmark me-2"></i> [[${session.errorMsg}]]
				<th:block th:text="${@commnServiceImpl.removeSessionMessage()}"></th:block>
			</div>

			<div class="row g-4">
				<!-- Add Category Form -->
				<div class="col-lg-4">
					<div class="card-modern shadow-md">
						<h5 class="fw-bold mb-3 pb-2 border-bottom">
							<i class="fa-solid fa-plus-circle text-primary me-2"></i> Add New Category
						</h5>

						<form action="/admin/saveCategory" method="post" enctype="multipart/form-data">
							<div class="mb-3">
								<label class="form-label fw-semibold">Category Name</label>
								<input type="text" name="name" required class="form-control form-control-modern" placeholder="e.g. Smart Electronics">
							</div>

							<div class="mb-3">
								<label class="form-label fw-semibold d-block">Status</label>
								<div class="form-check form-check-inline">
									<input class="form-check-input" type="radio" checked value="true" name="isActive" id="catActive">
									<label class="form-check-label" for="catActive">Active</label>
								</div>
								<div class="form-check form-check-inline">
									<input class="form-check-input" type="radio" value="false" name="isActive" id="catInactive">
									<label class="form-check-label" for="catInactive">Inactive</label>
								</div>
							</div>

							<div class="mb-4">
								<label class="form-label fw-semibold">Upload Category Icon / Image</label>
								<input type="file" name="file" class="form-control form-control-modern">
							</div>

							<button type="submit" class="btn btn-accent w-100 py-2.5">
								<i class="fa-solid fa-floppy-disk me-1"></i> Save Category
							</button>
						</form>
					</div>
				</div>

				<!-- Categories Data Table -->
				<div class="col-lg-8">
					<div class="card-modern shadow-md">
						<h5 class="fw-bold mb-3 pb-2 border-bottom">
							<i class="fa-solid fa-list-check text-primary me-2"></i> Category Directory
						</h5>

						<div class="table-responsive">
							<table class="table table-modern">
								<thead>
									<tr>
										<th scope="col">#</th>
										<th scope="col">Category</th>
										<th scope="col">Status</th>
										<th scope="col">Icon</th>
										<th scope="col" class="text-end">Actions</th>
									</tr>
								</thead>
								<tbody>
									<tr th:each="cat,c:${categorys}">
										<td class="fw-bold text-muted">[[${c.count}]]</td>
										<td class="fw-bold">[[${cat.name}]]</td>
										<td>
											<span th:if="${cat.isActive}" class="badge bg-success bg-opacity-10 text-success fw-bold px-2.5 py-1">Active</span>
											<span th:unless="${cat.isActive}" class="badge bg-danger bg-opacity-10 text-danger fw-bold px-2.5 py-1">Inactive</span>
										</td>
										<td>
											<img th:src="@{'/img/category_img/'+${cat.imageName}}" th:alt="${cat.name}" class="rounded-3 border p-1" style="width: 45px; height: 45px; object-fit: cover;" onerror="this.src='https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=500&auto=format&fit=crop&q=60'">
										</td>
										<td class="text-end">
											<a th:href="@{'/admin/loadEditCategory/'+${cat.id}}" class="btn btn-outline-primary btn-sm me-1 rounded-pill px-3">
												<i class="fa-solid fa-pen-to-square me-1"></i> Edit
											</a>
											<a th:href="@{'/admin/deleteCategory/'+${cat.id}}" class="btn btn-outline-danger btn-sm rounded-pill px-3" onclick="return confirm('Are you sure you want to delete this category?');">
												<i class="fa-solid fa-trash me-1"></i> Delete
											</a>
										</td>
									</tr>
								</tbody>
							</table>
						</div>

						<div class="d-flex justify-content-between align-items-center mt-3 pt-3 border-top" th:if="${totalPages > 0}">
							<div class="text-muted small">Total Categories: [[${totalElements}]]</div>
							<nav aria-label="Pagination">
								<ul class="pagination pagination-sm mb-0">
									<li class="page-item" th:classappend="${isFirst} ? 'disabled':''">
										<a class="page-link" th:href="@{'/admin/category?pageNo='+${pageNo-1}}">&laquo;</a>
									</li>
									<li th:each="i:${#numbers.sequence(1, totalPages)}" class="page-item" th:classappend="${pageNo+1==i}?'active':''">
										<a class="page-link" th:href="@{'/admin/category?pageNo='+${i-1}}">[[${i}]]</a>
									</li>
									<li class="page-item" th:classappend="${isLast} ? 'disabled':''">
										<a class="page-link" th:href="@{'/admin/category?pageNo='+${pageNo+1}}">&raquo;</a>
									</li>
								</ul>
							</nav>
						</div>
					</div>
				</div>
			</div>
		</div>
	</section>
</body>
</html>
