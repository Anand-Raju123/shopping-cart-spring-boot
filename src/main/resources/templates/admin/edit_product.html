<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{base::layout(~{::section})}">
<head>
<meta charset="UTF-8">
<title>Edit Product - Admin Dashboard</title>
</head>
<body>
	<section class="py-5">
		<div class="container">
			<div class="row justify-content-center">
				<div class="col-lg-8">
					<div class="card-modern shadow-lg">
						<div class="d-flex justify-content-between align-items-center pb-3 mb-4 border-bottom">
							<div>
								<a href="/admin/products" class="text-decoration-none text-muted small fw-semibold me-2">
									<i class="fa-solid fa-arrow-left me-1"></i> Back to Products
								</a>
								<h3 class="fw-bold mb-0"><i class="fa-solid fa-pen-to-square text-primary me-2"></i> Edit Product</h3>
							</div>
						</div>

						<div th:if="${session.succMsg}" class="alert alert-success alert-dismissible fade show rounded-3 mb-4" role="alert">
							<i class="fa-solid fa-circle-check me-2"></i> [[${session.succMsg}]]
							<th:block th:text="${@commnServiceImpl.removeSessionMessage()}"></th:block>
						</div>

						<div th:if="${session.errorMsg}" class="alert alert-danger alert-dismissible fade show rounded-3 mb-4" role="alert">
							<i class="fa-solid fa-circle-xmark me-2"></i> [[${session.errorMsg}]]
							<th:block th:text="${@commnServiceImpl.removeSessionMessage()}"></th:block>
						</div>

						<form action="/admin/updateProduct" method="post" enctype="multipart/form-data">
							<input type="hidden" name="id" th:value="${product.id}">

							<div class="mb-3">
								<label class="form-label fw-semibold">Product Title</label>
								<input type="text" name="title" th:value="${product.title}" required class="form-control form-control-modern">
							</div>

							<div class="mb-3">
								<label class="form-label fw-semibold">Description</label>
								<textarea rows="3" name="description" required class="form-control form-control-modern">[[${product.description}]]</textarea>
							</div>

							<div class="row g-3 mb-3">
								<div class="col-md-6">
									<label class="form-label fw-semibold">Category</label>
									<select required class="form-select form-control-modern" name="category">
										<option th:value="${product.category}">[[${product.category}]]</option>
										<option th:each="c:${categories}" th:if="${c.name != product.category}">[[${c.name}]]</option>
									</select>
								</div>
								<div class="col-md-6">
									<label class="form-label fw-semibold">Original Price (&#8377;)</label>
									<input type="number" step="0.01" name="price" th:value="${product.price}" required class="form-control form-control-modern">
								</div>
							</div>

							<div class="row g-3 mb-3">
								<div class="col-md-6">
									<label class="form-label fw-semibold">Discount (%)</label>
									<input type="number" name="discount" th:value="${product.discount}" required class="form-control form-control-modern">
								</div>
								<div class="col-md-6">
									<label class="form-label fw-semibold">Discounted Price (&#8377;)</label>
									<input type="number" readonly th:value="${product.discountPrice}" class="form-control form-control-modern bg-light">
								</div>
							</div>

							<div class="row g-3 mb-4">
								<div class="col-md-4">
									<label class="form-label fw-semibold">Stock Quantity</label>
									<input type="number" name="stock" th:value="${product.stock}" required class="form-control form-control-modern">
								</div>
								<div class="col-md-4">
									<label class="form-label fw-semibold d-block">Status</label>
									<div class="form-check form-check-inline mt-2">
										<input class="form-check-input" type="radio" th:checked="${product.isActive==true}" value="true" name="isActive" id="pActive">
										<label class="form-check-label" for="pActive">Active</label>
									</div>
									<div class="form-check form-check-inline mt-2">
										<input class="form-check-input" type="radio" th:checked="${product.isActive==false}" value="false" name="isActive" id="pInactive">
										<label class="form-check-label" for="pInactive">Inactive</label>
									</div>
								</div>
								<div class="col-md-4">
									<label class="form-label fw-semibold">Replace Image</label>
									<input type="file" name="file" class="form-control form-control-modern">
								</div>
							</div>

							<div class="mb-4 text-center p-3 bg-light rounded-3 border">
								<span class="text-muted small d-block mb-2">Current Product Image:</span>
								<img th:src="@{'/img/product_img/'+${product.image}}" th:alt="${product.title}" class="rounded-3 border p-1" style="width: 100px; height: 100px; object-fit: contain;" onerror="this.src='https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=500&auto=format&fit=crop&q=60'">
							</div>

							<button type="submit" class="btn btn-accent w-100 py-3 fs-6">
								<i class="fa-solid fa-floppy-disk me-2"></i> Save Product Changes
							</button>
						</form>
					</div>
				</div>
			</div>
		</div>
	</section>
</body>
</html>
