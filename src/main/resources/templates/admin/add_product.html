<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{base::layout(~{::section})}">
<head>
<meta charset="UTF-8">
<title>Add Product - Admin Dashboard</title>
</head>
<body>
	<section class="py-5">
		<div class="container">
			<div class="row justify-content-center">
				<div class="col-lg-8">
					<div class="card-modern shadow-lg">
						<div class="d-flex justify-content-between align-items-center pb-3 mb-4 border-bottom">
							<div>
								<a href="/admin/products" class="text-decoration-none text-muted small fw-semibold me-2">
									<i class="fa-solid fa-arrow-left me-1"></i> Back to Products
								</a>
								<h3 class="fw-bold mb-0"><i class="fa-solid fa-cart-plus text-primary me-2"></i> Add New Product</h3>
							</div>
						</div>

						<div th:if="${session.succMsg}" class="alert alert-success alert-dismissible fade show rounded-3 mb-4" role="alert">
							<i class="fa-solid fa-circle-check me-2"></i> [[${session.succMsg}]]
							<th:block th:text="${@commnServiceImpl.removeSessionMessage()}"></th:block>
						</div>

						<div th:if="${session.errorMsg}" class="alert alert-danger alert-dismissible fade show rounded-3 mb-4" role="alert">
							<i class="fa-solid fa-circle-xmark me-2"></i> [[${session.errorMsg}]]
							<th:block th:text="${@commnServiceImpl.removeSessionMessage()}"></th:block>
						</div>

						<form action="/admin/saveProduct" method="post" enctype="multipart/form-data">
							<div class="mb-3">
								<label class="form-label fw-semibold">Product Title</label>
								<input type="text" name="title" required class="form-control form-control-modern" placeholder="e.g. Ultra Wireless Headphones">
							</div>

							<div class="mb-3">
								<label class="form-label fw-semibold">Product Description</label>
								<textarea rows="3" name="description" required class="form-control form-control-modern" placeholder="Enter detailed product specifications & features..."></textarea>
							</div>

							<div class="row g-3 mb-3">
								<div class="col-md-6">
									<label class="form-label fw-semibold">Category</label>
									<select required class="form-select form-control-modern" name="category">
										<option value="">-- Choose Category --</option>
										<option th:each="c:${categories}">[[${c.name}]]</option>
									</select>
								</div>
								<div class="col-md-6">
									<label class="form-label fw-semibold">Price (&#8377;)</label>
									<input type="number" step="0.01" name="price" required class="form-control form-control-modern" placeholder="e.g. 4999.00">
								</div>
							</div>

							<div class="row g-3 mb-4">
								<div class="col-md-4">
									<label class="form-label fw-semibold">Stock Quantity</label>
									<input type="number" name="stock" required class="form-control form-control-modern" placeholder="e.g. 50">
								</div>
								<div class="col-md-4">
									<label class="form-label fw-semibold d-block">Status</label>
									<div class="form-check form-check-inline mt-2">
										<input class="form-check-input" type="radio" checked value="true" name="isActive" id="pActive">
										<label class="form-check-label" for="pActive">Active</label>
									</div>
									<div class="form-check form-check-inline mt-2">
										<input class="form-check-input" type="radio" value="false" name="isActive" id="pInactive">
										<label class="form-check-label" for="pInactive">Inactive</label>
									</div>
								</div>
								<div class="col-md-4">
									<label class="form-label fw-semibold">Product Image</label>
									<input type="file" name="file" class="form-control form-control-modern">
								</div>
							</div>

							<button type="submit" class="btn btn-accent w-100 py-3 fs-6">
								<i class="fa-solid fa-cloud-arrow-up me-2"></i> Publish Product
							</button>
						</form>
					</div>
				</div>
			</div>
		</div>
	</section>
</body>
</html>
