<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{base::layout(~{::section})}">
<head>
<meta charset="UTF-8">
<title>Edit Category - Admin Dashboard</title>
</head>
<body>
	<section class="py-5">
		<div class="container">
			<div class="row justify-content-center">
				<div class="col-lg-6">
					<div class="card-modern shadow-lg">
						<div class="d-flex justify-content-between align-items-center pb-3 mb-4 border-bottom">
							<div>
								<a href="/admin/category" class="text-decoration-none text-muted small fw-semibold me-2">
									<i class="fa-solid fa-arrow-left me-1"></i> Back to Categories
								</a>
								<h3 class="fw-bold mb-0"><i class="fa-solid fa-pen-to-square text-primary me-2"></i> Edit Category</h3>
							</div>
						</div>

						<div th:if="${session.succMsg}" class="alert alert-success alert-dismissible fade show rounded-3 mb-4" role="alert">
							<i class="fa-solid fa-circle-check me-2"></i> [[${session.succMsg}]]
							<th:block th:text="${@commnServiceImpl.removeSessionMessage()}"></th:block>
						</div>

						<div th:if="${session.errorMsg}" class="alert alert-danger alert-dismissible fade show rounded-3 mb-4" role="alert">
							<i class="fa-solid fa-circle-xmark me-2"></i> [[${session.errorMsg}]]
							<th:block th:text="${@commnServiceImpl.removeSessionMessage()}"></th:block>
						</div>

						<form action="/admin/updateCategory" method="post" enctype="multipart/form-data">
							<input type="hidden" name="id" th:value="${category.id}">

							<div class="mb-3">
								<label class="form-label fw-semibold">Category Name</label>
								<input type="text" name="name" th:value="${category.name}" required class="form-control form-control-modern">
							</div>

							<div class="mb-3">
								<label class="form-label fw-semibold d-block">Status</label>
								<div class="form-check form-check-inline">
									<input class="form-check-input" type="radio" th:checked="${category.isActive==true}" value="true" name="isActive" id="catActive">
									<label class="form-check-label" for="catActive">Active</label>
								</div>
								<div class="form-check form-check-inline">
									<input class="form-check-input" type="radio" th:checked="${category.isActive==false}" value="false" name="isActive" id="catInactive">
									<label class="form-check-label" for="catInactive">Inactive</label>
								</div>
							</div>

							<div class="mb-4">
								<label class="form-label fw-semibold">Replace Category Image</label>
								<input type="file" name="file" class="form-control form-control-modern">
							</div>

							<div class="mb-4 text-center p-3 bg-light rounded-3 border">
								<span class="text-muted small d-block mb-2">Current Category Image:</span>
								<img th:src="@{'/img/category_img/'+${category.imageName}}" th:alt="${category.name}" class="rounded-3 border p-1" style="width: 80px; height: 80px; object-fit: cover;" onerror="this.src='https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=500&auto=format&fit=crop&q=60'">
							</div>

							<button type="submit" class="btn btn-accent w-100 py-3 fs-6">
								<i class="fa-solid fa-floppy-disk me-2"></i> Update Category
							</button>
						</form>
					</div>
				</div>
			</div>
		</div>
	</section>
</body>
</html>
