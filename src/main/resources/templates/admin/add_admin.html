<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{base::layout(~{::section})}">
<head>
<meta charset="UTF-8">
<title>Add Admin - Admin Dashboard</title>
</head>
<body>
	<section class="py-5">
		<div class="container">
			<div class="row justify-content-center">
				<div class="col-lg-8">
					<div class="card-modern shadow-lg">
						<div class="d-flex justify-content-between align-items-center pb-3 mb-4 border-bottom">
							<div>
								<a href="/admin/" class="text-decoration-none text-muted small fw-semibold me-2">
									<i class="fa-solid fa-arrow-left me-1"></i> Dashboard
								</a>
								<h3 class="fw-bold mb-0"><i class="fa-solid fa-user-shield text-primary me-2"></i> Add New Administrator</h3>
							</div>
						</div>

						<div th:if="${session.succMsg}" class="alert alert-success alert-dismissible fade show rounded-3 mb-4" role="alert">
							<i class="fa-solid fa-circle-check me-2"></i> [[${session.succMsg}]]
							<th:block th:text="${@commnServiceImpl.removeSessionMessage()}"></th:block>
						</div>

						<div th:if="${session.errorMsg}" class="alert alert-danger alert-dismissible fade show rounded-3 mb-4" role="alert">
							<i class="fa-solid fa-circle-xmark me-2"></i> [[${session.errorMsg}]]
							<th:block th:text="${@commnServiceImpl.removeSessionMessage()}"></th:block>
						</div>

						<form action="/admin/save-admin" enctype="multipart/form-data" method="post">
							<div class="row g-3 mb-3">
								<div class="col-md-6">
									<label class="form-label fw-semibold">Full Name</label>
									<input required class="form-control form-control-modern" name="name" type="text" placeholder="Admin Name">
								</div>

								<div class="col-md-6">
									<label class="form-label fw-semibold">Mobile Number</label>
									<input required class="form-control form-control-modern" name="mobileNumber" type="text" placeholder="9876543210">
								</div>
							</div>

							<div class="mb-3">
								<label class="form-label fw-semibold">Email Address</label>
								<input required class="form-control form-control-modern" name="email" type="email" placeholder="admin@ecomstore.com">
							</div>

							<div class="row g-3 mb-3">
								<div class="col-md-6">
									<label class="form-label fw-semibold">Address Line</label>
									<input required class="form-control form-control-modern" name="address" type="text" placeholder="HQ Suite 100">
								</div>

								<div class="col-md-6">
									<label class="form-label fw-semibold">City</label>
									<input required class="form-control form-control-modern" name="city" type="text" placeholder="Metropolis">
								</div>
							</div>

							<div class="row g-3 mb-3">
								<div class="col-md-6">
									<label class="form-label fw-semibold">State</label>
									<input required class="form-control form-control-modern" name="state" type="text" placeholder="State Capital">
								</div>

								<div class="col-md-6">
									<label class="form-label fw-semibold">Pincode</label>
									<input required class="form-control form-control-modern" name="pincode" type="text" placeholder="500001">
								</div>
							</div>

							<div class="row g-3 mb-3">
								<div class="col-md-6">
									<label class="form-label fw-semibold">Password</label>
									<input required class="form-control form-control-modern" name="password" type="password" placeholder="••••••••">
								</div>

								<div class="col-md-6">
									<label class="form-label fw-semibold">Confirm Password</label>
									<input required class="form-control form-control-modern" name="cpassword" type="password" placeholder="••••••••">
								</div>
							</div>

							<div class="mb-4">
								<label class="form-label fw-semibold">Profile Photo (Optional)</label>
								<input class="form-control form-control-modern" name="img" type="file" accept="image/*">
							</div>

							<button type="submit" class="btn btn-accent w-100 py-3 fs-6">
								<i class="fa-solid fa-user-plus me-1"></i> Register Admin Account
							</button>
						</form>
					</div>
				</div>
			</div>
		</div>
	</section>
</body>
</html>
