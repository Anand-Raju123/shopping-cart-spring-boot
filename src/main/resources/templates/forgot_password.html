<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{base::layout(~{::section})}">
<head>
<meta charset="UTF-8">
<title>Forgot Password - EcomStore</title>
</head>
<body>
	<section class="py-5 my-4">
		<div class="container">
			<div class="row justify-content-center">
				<div class="col-lg-5 col-md-8">
					<div class="card-modern shadow-lg">
						<div class="text-center mb-4">
							<div class="rounded-circle bg-primary bg-opacity-10 text-primary d-inline-flex p-3 fs-3 mb-2">
								<i class="fa-solid fa-key"></i>
							</div>
							<h3 class="fw-bold">Reset Password</h3>
							<p class="text-muted small">Enter your account email to receive a password reset link</p>
						</div>

						<div th:if="${session.succMsg}" class="alert alert-success alert-dismissible fade show rounded-3 mb-3" role="alert">
							<i class="fa-solid fa-circle-check me-2"></i> [[${session.succMsg}]]
							<th:block th:text="${@commnServiceImpl.removeSessionMessage()}"></th:block>
						</div>

						<div th:if="${session.errorMsg}" class="alert alert-danger alert-dismissible fade show rounded-3 mb-3" role="alert">
							<i class="fa-solid fa-circle-xmark me-2"></i> [[${session.errorMsg}]]
							<th:block th:text="${@commnServiceImpl.removeSessionMessage()}"></th:block>
						</div>

						<form action="/forgot-password" method="post">
							<div class="mb-4">
								<label class="form-label fw-semibold">Email Address</label>
								<div class="input-group">
									<span class="input-group-text bg-light border-end-0"><i class="fa-regular fa-envelope text-muted"></i></span>
									<input required class="form-control form-control-modern border-start-0" name="email" type="email" placeholder="name@example.com">
								</div>
							</div>

							<button type="submit" class="btn btn-accent w-100 py-3 fs-6">
								<i class="fa-solid fa-paper-plane me-1"></i> Send Reset Link
							</button>
						</form>

						<div class="text-center mt-4 pt-3 border-top">
							<a href="/signin" class="fw-bold text-primary text-decoration-none"><i class="fa-solid fa-arrow-left me-1"></i> Back to Sign In</a>
						</div>
					</div>
				</div>
			</div>
		</div>
	</section>
</body>
</html>
