<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{base::layout(~{::section})}">
<head>
<meta charset="UTF-8">
<title>Register - EcomStore</title>
</head>
<body>
	<section>
		<div class="container py-5">
			<div class="row justify-content-center">
				<div class="col-lg-8">
					<div class="card-modern shadow-lg">
						<div class="text-center mb-4">
							<div class="rounded-circle bg-primary bg-opacity-10 text-primary d-inline-flex p-3 fs-3 mb-2">
								<i class="fa-solid fa-user-plus"></i>
							</div>
							<h3 class="fw-bold">Create Account</h3>
							<p class="text-muted small">Join EcomStore today for seamless shopping</p>
						</div>

						<div th:if="${session.succMsg}" class="alert alert-success alert-dismissible fade show rounded-3" role="alert">
							<i class="fa-solid fa-circle-check me-2"></i> [[${session.succMsg}]]
							<th:block th:text="${@commnServiceImpl.removeSessionMessage()}"></th:block>
						</div>

						<div th:if="${session.errorMsg}" class="alert alert-danger alert-dismissible fade show rounded-3" role="alert">
							<i class="fa-solid fa-circle-xmark me-2"></i> [[${session.errorMsg}]]
							<th:block th:text="${@commnServiceImpl.removeSessionMessage()}"></th:block>
						</div>

						<form action="/saveUser" enctype="multipart/form-data" id="userRegister" novalidate method="post">
							<div class="row g-3 mb-3">
								<div class="col-md-6">
									<label class="form-label fw-semibold">Full Name</label>
									<input required class="form-control form-control-modern" name="name" type="text" placeholder="John Doe">
								</div>

								<div class="col-md-6">
									<label class="form-label fw-semibold">Mobile Number</label>
									<input required class="form-control form-control-modern" name="mobileNumber" type="text" placeholder="9876543210">
								</div>
							</div>

							<div class="mb-3">
								<label class="form-label fw-semibold">Email Address</label>
								<input required class="form-control form-control-modern" name="email" type="email" placeholder="john@example.com">
							</div>

							<div class="row g-3 mb-3">
								<div class="col-md-6">
									<label class="form-label fw-semibold">Address Line</label>
									<input required class="form-control form-control-modern" name="address" type="text" placeholder="123 Street Name">
								</div>

								<div class="col-md-6">
									<label class="form-label fw-semibold">City</label>
									<input required class="form-control form-control-modern" name="city" type="text" placeholder="New York">
								</div>
							</div>

							<div class="row g-3 mb-3">
								<div class="col-md-6">
									<label class="form-label fw-semibold">State</label>
									<input required class="form-control form-control-modern" name="state" type="text" placeholder="New York">
								</div>

								<div class="col-md-6">
									<label class="form-label fw-semibold">Pincode / Postal Code</label>
									<input required class="form-control form-control-modern" name="pincode" type="text" placeholder="10001">
								</div>
							</div>

							<div class="row g-3 mb-3">
								<div class="col-md-6">
									<label class="form-label fw-semibold">Password</label>
									<input required class="form-control form-control-modern" name="password" type="password" id="pass" placeholder="••••••••">
								</div>

								<div class="col-md-6">
									<label class="form-label fw-semibold">Confirm Password</label>
									<input required class="form-control form-control-modern" name="confirmpassword" type="password" placeholder="••••••••">
								</div>
							</div>

							<div class="mb-4">
								<label class="form-label fw-semibold">Profile Photo (Optional)</label>
								<input class="form-control form-control-modern" name="img" type="file" accept="image/*">
							</div>

							<button type="submit" class="btn btn-accent w-100 py-3 fs-6">
								<i class="fa-solid fa-user-plus me-1"></i> Register Account
							</button>
						</form>

						<div class="text-center mt-4 pt-3 border-top">
							<span class="text-muted small">Already have an account?</span>
							<a href="/signin" class="fw-bold text-primary text-decoration-none ms-1">Sign In Here</a>
						</div>
					</div>
				</div>
			</div>
		</div>
	</section>
</body>
</html>
