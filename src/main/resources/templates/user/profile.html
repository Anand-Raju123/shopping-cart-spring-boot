<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{base::layout(~{::section})}">
<head>
<meta charset="UTF-8">
<title>My Profile - EcomStore</title>
</head>
<body>
	<section class="py-5">
		<div class="container">
			<div class="row g-4 justify-content-center">
				<div class="col-lg-8">
					<div class="card-modern shadow-lg mb-4">
						<div class="text-center pb-4 mb-4 border-bottom">
							<div class="position-relative d-inline-block mb-3">
								<div class="rounded-circle bg-primary text-white d-flex align-items-center justify-content-center border shadow-sm mx-auto" style="width: 100px; height: 100px; font-size: 2.5rem; font-weight: 800;">
									[[${#strings.substring(user.name, 0, 1).toUpperCase()}]]
								</div>
							</div>
							<h3 class="fw-bold mb-0">[[${user.name}]]</h3>
							<span class="badge bg-primary bg-opacity-10 text-primary fw-bold px-3 py-1.5 rounded-pill mt-1">[[${user.role}]]</span>
						</div>

						<div th:if="${session.succMsg}" class="alert alert-success alert-dismissible fade show rounded-3 mb-4" role="alert">
							<i class="fa-solid fa-circle-check me-2"></i> [[${session.succMsg}]]
							<th:block th:text="${@commnServiceImpl.removeSessionMessage()}"></th:block>
						</div>

						<div th:if="${session.errorMsg}" class="alert alert-danger alert-dismissible fade show rounded-3 mb-4" role="alert">
							<i class="fa-solid fa-circle-xmark me-2"></i> [[${session.errorMsg}]]
							<th:block th:text="${@commnServiceImpl.removeSessionMessage()}"></th:block>
						</div>

						<form action="/user/update-profile" method="post" enctype="multipart/form-data">
							<input type="hidden" th:value="${user.id}" name="id">

							<h5 class="fw-bold mb-3"><i class="fa-solid fa-id-card text-primary me-2"></i> Account Information</h5>

							<div class="row g-3 mb-3">
								<div class="col-md-6">
									<label class="form-label fw-semibold">Full Name</label>
									<input type="text" name="name" class="form-control form-control-modern" th:value="${user.name}">
								</div>
								<div class="col-md-6">
									<label class="form-label fw-semibold">Mobile Number</label>
									<input type="text" name="mobileNumber" class="form-control form-control-modern" th:value="${user.mobileNumber}">
								</div>
							</div>

							<div class="mb-3">
								<label class="form-label fw-semibold">Email Address (Read-only)</label>
								<input type="text" readonly class="form-control form-control-modern bg-light" th:value="${user.email}">
							</div>

							<div class="mb-3">
								<label class="form-label fw-semibold">Street Address</label>
								<input type="text" name="address" class="form-control form-control-modern" th:value="${user.address}">
							</div>

							<div class="row g-3 mb-4">
								<div class="col-md-4">
									<label class="form-label fw-semibold">City</label>
									<input type="text" name="city" class="form-control form-control-modern" th:value="${user.city}">
								</div>
								<div class="col-md-4">
									<label class="form-label fw-semibold">State</label>
									<input type="text" name="state" class="form-control form-control-modern" th:value="${user.state}">
								</div>
								<div class="col-md-4">
									<label class="form-label fw-semibold">Pincode</label>
									<input type="text" name="pincode" class="form-control form-control-modern" th:value="${user.pincode}">
								</div>
							</div>

							<div class="mb-4">
								<label class="form-label fw-semibold">Update Profile Photo</label>
								<input type="file" name="img" class="form-control form-control-modern">
							</div>

							<button type="submit" class="btn btn-accent w-100 py-3">
								<i class="fa-solid fa-floppy-disk me-1"></i> Update Profile Details
							</button>
						</form>
					</div>

					<!-- Change Password Card -->
					<div class="card-modern shadow-lg">
						<h5 class="fw-bold mb-4 pb-2 border-bottom">
							<i class="fa-solid fa-key text-primary me-2"></i> Change Password
						</h5>

						<form action="/user/change-password" method="post">
							<div class="mb-3">
								<label class="form-label fw-semibold">Current Password</label>
								<input type="password" name="currentPassword" required class="form-control form-control-modern" placeholder="••••••••">
							</div>

							<div class="row g-3 mb-4">
								<div class="col-md-6">
									<label class="form-label fw-semibold">New Password</label>
									<input type="password" name="newPassword" required class="form-control form-control-modern" placeholder="••••••••">
								</div>
								<div class="col-md-6">
									<label class="form-label fw-semibold">Confirm New Password</label>
									<input type="password" name="confirmPassword" required class="form-control form-control-modern" placeholder="••••••••">
								</div>
							</div>

							<button type="submit" class="btn btn-outline-custom w-100 py-2.5">
								<i class="fa-solid fa-lock-rotate me-1"></i> Update Password
							</button>
						</form>
					</div>
				</div>
			</div>
		</div>
	</section>
</body>
</html>
