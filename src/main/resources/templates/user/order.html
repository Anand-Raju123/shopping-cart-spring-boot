<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{base::layout(~{::section})}">
<head>
<meta charset="UTF-8">
<title>Checkout - EcomStore</title>
</head>
<body>
	<section class="py-4">
		<div class="container">
			<form action="/user/save-order" method="post" id="orders">
				<div class="row g-4">
					<!-- Shipping Address Form -->
					<div class="col-lg-7">
						<div class="card-custom p-4">
							<h4 class="fw-bold text-dark mb-4 pb-2 border-bottom">
								<i class="fa-solid fa-truck-fast text-primary me-2"></i> Shipping &amp; Billing Details
							</h4>

							<div class="row g-3 mb-3">
								<div class="col-md-6">
									<label class="form-label fw-semibold small">First Name</label>
									<input type="text" name="firstName" required class="form-control form-control-custom" th:value="${user!=null ? #strings.arraySplit(user.name, ' ')[0] : ''}">
								</div>
								<div class="col-md-6">
									<label class="form-label fw-semibold small">Last Name</label>
									<input type="text" name="lastName" required class="form-control form-control-custom" th:value="${user!=null and #strings.arraySplit(user.name, ' ').length > 1 ? #strings.arraySplit(user.name, ' ')[1] : ''}">
								</div>
							</div>

							<div class="row g-3 mb-3">
								<div class="col-md-6">
									<label class="form-label fw-semibold small">Email Address</label>
									<input type="email" name="email" required class="form-control form-control-custom" th:value="${user!=null ? user.email : ''}">
								</div>
								<div class="col-md-6">
									<label class="form-label fw-semibold small">Phone Number</label>
									<input type="text" name="mobileNo" required class="form-control form-control-custom" th:value="${user!=null ? user.mobileNumber : ''}">
								</div>
							</div>

							<div class="mb-3">
								<label class="form-label fw-semibold small">Street Address</label>
								<input type="text" name="address" required class="form-control form-control-custom" th:value="${user!=null ? user.address : ''}">
							</div>

							<div class="row g-3">
								<div class="col-md-4">
									<label class="form-label fw-semibold small">City</label>
									<input type="text" name="city" required class="form-control form-control-custom" th:value="${user!=null ? user.city : ''}">
								</div>
								<div class="col-md-4">
									<label class="form-label fw-semibold small">State</label>
									<input type="text" name="state" required class="form-control form-control-custom" th:value="${user!=null ? user.state : ''}">
								</div>
								<div class="col-md-4">
									<label class="form-label fw-semibold small">Pincode</label>
									<input type="text" name="pincode" required class="form-control form-control-custom" th:value="${user!=null ? user.pincode : ''}">
								</div>
							</div>
						</div>
					</div>

					<!-- Summary & Payment Column -->
					<div class="col-lg-5">
						<div class="card-custom p-4">
							<h4 class="fw-bold text-dark mb-3 pb-2 border-bottom">
								<i class="fa-solid fa-receipt text-primary me-2"></i> Payment Summary
							</h4>

							<div class="d-flex justify-content-between mb-2 small text-secondary">
								<span>Items Subtotal</span>
								<span class="fw-semibold text-dark">&#8377;[[${#numbers.formatDecimal(orderPrice, 1, 'COMMA', 2, 'POINT')}]]</span>
							</div>

							<div class="d-flex justify-content-between mb-2 small text-secondary">
								<span>Shipping Charge</span>
								<span class="fw-semibold text-dark">&#8377;250.00</span>
							</div>

							<div class="d-flex justify-content-between mb-3 pb-3 border-bottom small text-secondary">
								<span>Taxes &amp; Fees</span>
								<span class="fw-semibold text-dark">&#8377;100.00</span>
							</div>

							<div class="d-flex justify-content-between align-items-center mb-4">
								<span class="fw-bold text-dark fs-5">Total Payable Amount</span>
								<span class="fs-4 fw-bold text-dark">&#8377;[[${#numbers.formatDecimal(totalOrderPrice, 1, 'COMMA', 2, 'POINT')}]]</span>
							</div>

							<div class="mb-4">
								<label class="form-label fw-semibold small">Select Payment Method</label>
								<select required name="paymentType" class="form-select form-select-custom">
									<option value="COD" selected>Cash On Delivery (COD)</option>
									<option value="ONLINE">UPI / Debit &amp; Credit Card</option>
								</select>
							</div>

							<button type="submit" class="btn btn-primary-custom w-100 py-3 fs-6">
								<i class="fa-solid fa-lock me-1"></i> Confirm &amp; Place Order
							</button>
						</div>
					</div>
				</div>
			</form>
		</div>
	</section>
</body>
</html>
