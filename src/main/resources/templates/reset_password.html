<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{base::layout(~{::section})}">
<head>
<meta charset="UTF-8">
<title>Reset Password - EcomStore</title>
</head>
<body>
	<section class="py-5 my-4">
		<div class="container">
			<div class="row justify-content-center">
				<div class="col-lg-5 col-md-8">
					<div class="card-modern shadow-lg">
						<div class="text-center mb-4">
							<div class="rounded-circle bg-primary bg-opacity-10 text-primary d-inline-flex p-3 fs-3 mb-2">
								<i class="fa-solid fa-lock-open"></i>
							</div>
							<h3 class="fw-bold">Create New Password</h3>
							<p class="text-muted small">Type and confirm your new account password</p>
						</div>

						<div th:if="${session.succMsg}" class="alert alert-success alert-dismissible fade show rounded-3 mb-3" role="alert">
							<i class="fa-solid fa-circle-check me-2"></i> [[${session.succMsg}]]
							<th:block th:text="${@commnServiceImpl.removeSessionMessage()}"></th:block>
						</div>

						<div th:if="${session.errorMsg}" class="alert alert-danger alert-dismissible fade show rounded-3 mb-3" role="alert">
							<i class="fa-solid fa-circle-xmark me-2"></i> [[${session.errorMsg}]]
							<th:block th:text="${@commnServiceImpl.removeSessionMessage()}"></th:block>
						</div>

						<form action="/reset-password" method="post" id="resetPassword" novalidate>
							<div class="mb-3">
								<label class="form-label fw-semibold">New Password</label>
								<input id="pass" required class="form-control form-control-modern" name="password" type="password" placeholder="••••••••">
							</div>

							<div class="mb-4">
								<label class="form-label fw-semibold">Confirm Password</label>
								<input required class="form-control form-control-modern" name="confirmPassword" type="password" placeholder="••••••••">
							</div>

							<input type="hidden" th:value="${token}" name="token">
							<button type="submit" class="btn btn-accent w-100 py-3 fs-6">
								<i class="fa-solid fa-floppy-disk me-1"></i> Set New Password
							</button>
						</form>
					</div>
				</div>
			</div>
		</div>
	</section>
</body>
</html>
